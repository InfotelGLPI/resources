name: Composer Security Audit

on:
  push:
  pull_request:
  schedule:
    # Weekly, so a newly published advisory is caught even without a commit.
    - cron: '17 6 * * 1'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  composer-audit:
    name: "composer audit (runtime dependencies)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, openssl, ldap
          coverage: none

      - name: Resolve runtime dependencies
        # composer.lock is intentionally not tracked (GLPI plugin convention),
        # so resolve the runtime tree at build time. This also means the weekly
        # cron audits whatever versions the "^3.0" constraint resolves to today,
        # not a pinned snapshot.
        run: composer update --no-dev --no-progress --ansi

      - name: Audit runtime dependencies
        # Fail the build on any known security advisory. The LDAP client was
        # migrated from the abandoned adldap2/adldap2 to the maintained
        # directorytree/ldaprecord; --abandoned=report is kept as a defensive
        # net (report only, not a build failure) in case a transitive package
        # becomes abandoned later.
        run: composer audit --no-dev --abandoned=report --ansi
